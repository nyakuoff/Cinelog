# Detect social-media link scrapers by user-agent. These clients don't run JS,
# so for /media/:id we hand them server-rendered Open Graph tags from the API
# instead of the empty SPA shell. Real browsers fall through to the SPA.
map $http_user_agent $is_crawler {
  default 0;
  "~*(facebookexternalhit|Facebot|Twitterbot|Slackbot|Discordbot|WhatsApp|TelegramBot|LinkedInBot|Pinterest|redditbot|Embedly|Googlebot|bingbot|Applebot|SkypeUriPreview|vkShare|W3C_Validator|Iframely)" 1;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css text/plain text/xml application/javascript text/javascript application/json
    application/manifest+json application/xml image/svg+xml;

  # Docker's embedded DNS — needed so the variable proxy_pass in the /media/
  # crawler branch below can resolve the "api" service name at request time.
  resolver 127.0.0.11 valid=30s ipv6=off;

  # Proxy API + artwork to the API service (same-origin for the browser).
  # ^~ so the static-extension regex below never steals /api/uploads/x.png etc.
  location ^~ /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Backup restore / imports upload big bodies and run long.
    client_max_body_size 25m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Media pages: crawlers get per-title OG tags from the API; humans get the SPA.
  location ~ ^/media/(?<media_id>[^/]+)$ {
    if ($is_crawler) {
      proxy_pass http://api:3000/api/og/media/$media_id;
    }
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    try_files $uri /index.html;
  }

  # PWA: correct MIME for the manifest; the entry points must never be stuck
  # in an HTTP cache (browsers must see new builds / a new service worker).
  # Nothing here sets other headers, so nested add_header needs no repeats.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
  # Every SPA fallback below lands here via an internal redirect.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Content-hashed build output: immutable. A missing file is a real 404 —
  # never the SPA shell (a cached index.html under a .js URL = white screen).
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Other static files (icons, splash, favicon): moderate cache, real 404s.
  location ~* \.(png|jpe?g|webp|svg|ico|js|mjs|css|map|woff2?|txt|xml|json)$ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # SPA fallback: every other path serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
